name: P0-2 Ruff and Formatting
run-name: P0-2 Ruff and Formatting • ${{ github.event_name }} • ${{ github.sha }}

on:
  push:
    paths:
      - "contracts/**"
      - "validation/**"
      - "tests/**"
      - "requirements-ci.txt"
      - ".github/workflows/p0-2-ruff-format.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "validation/**"
      - "tests/**"
      - "requirements-ci.txt"
      - ".github/workflows/p0-2-ruff-format.yml"
  workflow_dispatch:

concurrency:
  group: p0-2-ruff-format-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff-format:
    name: Ruff lint and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-ci.txt

      - name: Ruff lint
        run: python -m ruff check contracts validation tests

      - name: Ruff format check
        run: python -m ruff format --check contracts validation tests
