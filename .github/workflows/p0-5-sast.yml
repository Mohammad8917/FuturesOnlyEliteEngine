name: P0-5 Static Application Security Testing
run-name: P0-5 SAST • ${{ github.event_name }} • ${{ github.sha }}

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * *"

concurrency:
  group: p0-5-sast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit Python SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-sast.txt

      - name: Install pinned SAST tooling
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          -r requirements-sast.txt

      - name: Scan production Python source
        run: python -m bandit -r contracts validation -f screen
