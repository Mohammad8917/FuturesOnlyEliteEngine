name: G02 Typecheck
run-name: G02 Typecheck • ${{ github.event_name }} • ${{ github.sha }}

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: g02-typecheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  g02-typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-ci.txt

      - name: Run strict G02 typecheck
        run: python -m pyright --project pyrightconfig.json
