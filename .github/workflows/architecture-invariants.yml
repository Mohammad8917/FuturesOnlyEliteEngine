name: Architecture Invariants
# Same-SHA evidence anchor: authoritative state/gate commits rerun architecture verification.
# Gate-chain alignment: architecture, dependency, and domain evidence share one commit.
run-name: Architecture Invariants • ${{ github.event_name }} • ${{ github.sha }}

on:
  push:
    paths:
      - "docs/architecture/architecture-invariants.md"
      - "docs/architecture/architecture-contract.md"
      - "docs/architecture/dependency-rules.md"
      - "docs/architecture/futures-responsibility-map.md"
      - "docs/architecture/project-state.md"
      - "docs/architecture/master-roadmap-and-governance.md"
      - "docs/architecture/CHANGE-GUARD.md"
      - "docs/architecture/ARCHITECTURE-MASTER-INDEX.md"
      - "tests/architecture/test_architecture_invariants_contract.py"
      - "tests/architecture/test_architecture_contract.py"
      - "tests/architecture/test_dependency_rules_contract.py"
      - "tests/architecture/test_futures_responsibility_map_contract.py"
      - "tests/architecture/test_phase_control_consistency.py"
      - "tests/architecture/test_dependency_direction.py"
      - "tests/architecture/test_forbidden_imports.py"
      - ".github/workflows/architecture-invariants.yml"
  pull_request:
    paths:
      - "docs/architecture/architecture-invariants.md"
      - "docs/architecture/architecture-contract.md"
      - "docs/architecture/dependency-rules.md"
      - "docs/architecture/futures-responsibility-map.md"
      - "docs/architecture/project-state.md"
      - "docs/architecture/master-roadmap-and-governance.md"
      - "docs/architecture/CHANGE-GUARD.md"
      - "docs/architecture/ARCHITECTURE-MASTER-INDEX.md"
      - "tests/architecture/test_architecture_invariants_contract.py"
      - "tests/architecture/test_architecture_contract.py"
      - "tests/architecture/test_dependency_rules_contract.py"
      - "tests/architecture/test_futures_responsibility_map_contract.py"
      - "tests/architecture/test_phase_control_consistency.py"
      - "tests/architecture/test_dependency_direction.py"
      - "tests/architecture/test_forbidden_imports.py"
      - ".github/workflows/architecture-invariants.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-invariants:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check --no-input pytest

      - name: Run authoritative architecture contract tests
        run: python -m pytest -q tests/architecture/test_architecture_invariants_contract.py tests/architecture/test_architecture_contract.py tests/architecture/test_dependency_rules_contract.py tests/architecture/test_futures_responsibility_map_contract.py tests/architecture/test_phase_control_consistency.py tests/architecture/test_dependency_direction.py tests/architecture/test_forbidden_imports.py

# Same-SHA trigger anchor: liquidation-trigger contract closure verification.

# Final same-SHA trigger anchor: liquidation-trigger verification after export repair.
