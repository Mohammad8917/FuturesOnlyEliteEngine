name: Architecture Invariants

on:
  push:
    paths:
      - "docs/architecture/architecture-invariants.md"
      - "tests/architecture/test_architecture_invariants_contract.py"
      - ".github/workflows/architecture-invariants.yml"
  pull_request:
    paths:
      - "docs/architecture/architecture-invariants.md"
      - "tests/architecture/test_architecture_invariants_contract.py"
      - ".github/workflows/architecture-invariants.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-invariants:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check --no-input pytest

      - name: Run authoritative architecture contract tests
        run: python -m pytest -q tests/architecture/test_architecture_invariants_contract.py tests/architecture/test_architecture_contract.py
