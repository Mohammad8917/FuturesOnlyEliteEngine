name: G05 Coverage

on:
  push:
    paths:
      - "contracts/**"
      - "tests/**"
      - "requirements-ci.txt"
      - ".github/workflows/g05-coverage.yml"
      - "docs/architecture/**"
  pull_request:
    paths:
      - "contracts/**"
      - "tests/**"
      - "requirements-ci.txt"
      - ".github/workflows/g05-coverage.yml"
      - "docs/architecture/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g05-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  g05-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-ci.txt

      - name: Measure Futures contract coverage
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            --cov=contracts/futures \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=98 \
            tests/contracts

      - name: Enforce immutable XML coverage threshold
        if: always()
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("coverage.xml")
          if not report.is_file():
              raise SystemExit("G05 BLOCKED: coverage.xml was not produced")
          root = ET.parse(report).getroot()
          try:
              covered = int(root.attrib["lines-covered"])
              valid = int(root.attrib["lines-valid"])
          except (KeyError, TypeError, ValueError) as exc:
              raise SystemExit("G05 BLOCKED: coverage.xml has no valid line totals") from exc
          if valid <= 0:
              raise SystemExit("G05 BLOCKED: coverage.xml reports zero valid lines")
          ratio = covered / valid
          print(f"G05 authoritative line coverage: {covered}/{valid} = {ratio:.6%}")
          if ratio < 0.98:
              raise SystemExit("G05 BLOCKED: authoritative XML coverage is below 98.00%")
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g05-coverage-report
          path: coverage.xml
          if-no-files-found: error

# G05 is the immutable >=98% official coverage gate.
# Coverage is measured against production Futures contract code; no source exclusions,
# omit rules, threshold reduction, skip/xfail, artificial tests, or assertion weakening
# may be introduced to make the gate green.
# G05 is independent from G03 contract completeness and G08 mutation >=90%.
# Same-SHA evidence is mandatory.
