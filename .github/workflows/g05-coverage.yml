name: G05 Coverage

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g05-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  g05-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-ci.txt

      - name: Test fail-closed coverage XML guard
        run: python -m pytest -q tests/architecture/test_g05_coverage_guard.py

      - name: Measure Futures contract coverage
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            --cov=contracts/futures \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=98 \
            tests/contracts

      - name: Independently enforce the 98 percent coverage floor
        if: always()
        run: python scripts/verify_g05_coverage.py

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g05-coverage-report
          path: coverage.xml
          if-no-files-found: error

# G05 is the immutable >=98% official coverage gate.
# Coverage is measured against production Futures contract code; no source exclusions,
# omit rules, threshold reduction, skip/xfail, artificial tests, or assertion weakening
# may be introduced to make the gate green.
# G05 is independent from G03 contract completeness and G08 mutation >=90%.
# Same-SHA evidence is mandatory.
