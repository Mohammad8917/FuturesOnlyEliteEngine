concurrency:
  group: g04-architecture-boundaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  g04-architecture-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-ci.txt
      - name: Run signal-only regression guard
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/architecture/test_signal_only_no_live_execution.py
      - name: Run architecture boundary regression tests
        run: python -m pytest -q tests/architecture/test_g04_architecture_boundaries.py
      - name: Run strict dependency validator
        run: python validation/architecture_dependency_validator.py
