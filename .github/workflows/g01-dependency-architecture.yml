name: G01 Dependency Architecture
run-name: G01 Dependency Architecture • ${{ github.event_name }} • ${{ github.sha }}

on:
  push:
    paths:
      - "validation/**"
      - "contracts/**"
      - "tests/architecture/**"
      - "tests/contracts/**"
      - "docs/architecture/**"
      - "docs/architecture/project-state.md"
      - "requirements-ci.txt"
      - ".github/workflows/g01-dependency-architecture.yml"
  pull_request:
    paths:
      - "validation/**"
      - "contracts/**"
      - "tests/architecture/**"
      - "tests/contracts/**"
      - "docs/architecture/**"
      - ".github/workflows/g01-dependency-architecture.yml"
      - "requirements-ci.txt"
  workflow_dispatch:

concurrency:
  group: g01-dependency-architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  g01-dependency-architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-ci.txt

      - name: Run G01 CI hardening regression tests
        run: python -m pytest -q tests/architecture/test_g01_ci_hardening.py

      - name: Run Phase 1 completeness regression tests
        run: python -m pytest -q tests/architecture/test_phase1_completeness.py

      - name: Run dependency architecture regression tests
        run: python -m pytest -q tests/architecture/test_dependency_direction.py tests/architecture/test_forbidden_imports.py

# Gate-chain alignment: architecture, dependency, and domain evidence share one commit.
# CI hardening pattern aligned with the proven G02 implementation pattern in the historical repository,
# without importing its domain code, dependencies, Spot architecture, or lower coverage floor.
# Same-SHA evidence remains mandatory.

# Final hardening-test anchor: CI lock and workflow controls are verified on the same HEAD.
