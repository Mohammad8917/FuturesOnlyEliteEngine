name: G01 Dependency Architecture

on:
  push:
    paths:
      - "validation/**"
      - "tests/architecture/**"
      - "docs/architecture/**"
      - ".github/workflows/g01-dependency-architecture.yml"
  pull_request:
    paths:
      - "validation/**"
      - "tests/architecture/**"
      - "docs/architecture/**"
      - ".github/workflows/g01-dependency-architecture.yml"

permissions:
  contents: read

jobs:
  g01-dependency-architecture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check --no-input pytest

      - name: Run dependency architecture regression tests
        run: python -m pytest -q tests/architecture/test_dependency_direction.py tests/architecture/test_forbidden_imports.py
