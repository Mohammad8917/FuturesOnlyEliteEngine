name: G01 Dependency Architecture

on:
  push:
    branches: [main]
    paths:
      - "validation/**"
      - "tests/architecture/**"
      - "docs/architecture/**"
      - ".github/workflows/g01-dependency-architecture.yml"
  pull_request:
    paths:
      - "validation/**"
      - "tests/architecture/**"
      - "docs/architecture/**"
      - ".github/workflows/g01-dependency-architecture.yml"

permissions:
  contents: read

jobs:
  g01-dependency-architecture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ce0f5e4b3a1e3b6d4b3f0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Run dependency architecture regression test
        run: python -m pytest -q tests/architecture/test_dependency_direction.py
