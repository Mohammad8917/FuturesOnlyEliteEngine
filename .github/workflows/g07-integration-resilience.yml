name: G07 Applicability Classification and Integration/Resilience Enforcement

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g07-integration-resilience-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  applicability:
    name: G07 applicability classification (not an operational pass)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      operational_scope: ${{ steps.classify.outputs.operational_scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Classify G07 applicability from explicit project state
        id: classify
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          required = (
              "application", "risk", "execution", "infrastructure",
              "adapters", "configuration", "tests/integration", "tests/resilience",
          )
          operational_scope_present = any(Path(path).exists() for path in required)
          state_path = Path("docs/architecture/project-state.md")
          adr_path = Path("docs/architecture/adr/ADR-0001-phase-scoped-gate-applicability.md")
          state = state_path.read_text(encoding="utf-8") if state_path.is_file() else ""
          adr = adr_path.read_text(encoding="utf-8") if adr_path.is_file() else ""

          if operational_scope_present:
              operational_scope = "true"
              print("G07 APPLICABLE: operational scope detected; all required layers and real integration/resilience tests must pass.")
          else:
              phase1_only = (
                  "- Implementation phase authorized: YES — Phase 1 Domain Contracts only" in state
                  and "- Phase 2+ production implementation remains blocked" in state
              )
              approved_decision = "- **Status:** APPROVED" in adr and "NOT APPLICABLE (not passed)" in adr
              if not (phase1_only and approved_decision):
                  print("G07 BLOCKED: no operational paths exist, and approved Phase 1-only applicability is not evidenced.")
                  sys.exit(1)
              operational_scope = "false"
              print("G07 NOT APPLICABLE: explicit Phase 1-only scope; G07 has NOT passed and operational readiness is NOT established.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"operational_scope={operational_scope}\n")
          PY
  integration-resilience:
    name: G07 Integration and Resilience (operational scope only)
    needs: applicability
    if: needs.applicability.outputs.operational_scope == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-ci.txt
      - name: Require all operational layers and integration/resilience tests
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          required = (
              "application", "risk", "execution", "infrastructure",
              "adapters", "configuration", "tests/integration", "tests/resilience",
          )
          missing = [path for path in required if not Path(path).is_dir()]
          if missing:
              print("G07 BLOCKED: required operational layers or test suites are absent:")
              for path in missing:
                  print(f"- {path}/")
              print("Do not mark integration/resilience complete until these are implemented and tested.")
              sys.exit(1)
          PY
      - name: Run integration and resilience tests
        run: python -m pytest -q tests/integration tests/resilience
