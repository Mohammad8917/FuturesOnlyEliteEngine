name: G07 Integration and Resilience

on:
  push:
    paths:
      - "application/**"
      - "risk/**"
      - "execution/**"
      - "infrastructure/**"
      - "adapters/**"
      - "configuration/**"
      - "tests/integration/**"
      - "tests/resilience/**"
  pull_request:
    paths:
      - "application/**"
      - "risk/**"
      - "execution/**"
      - "infrastructure/**"
      - "adapters/**"
      - "configuration/**"
      - "tests/integration/**"
      - "tests/resilience/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g07-integration-resilience-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-resilience:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-ci.txt

      - name: Require operational layers and integration/resilience tests
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          required = (
              "application",
              "risk",
              "execution",
              "infrastructure",
              "adapters",
              "configuration",
              "tests/integration",
              "tests/resilience",
          )
          missing = [path for path in required if not Path(path).is_dir()]
          if missing:
              print("G07 BLOCKED: required operational layers or test suites are absent:")
              for path in missing:
                  print(f"- {path}/")
              print("Do not mark integration/resilience complete until these are implemented and tested.")
              sys.exit(1)
          PY

      - name: Run integration and resilience tests
        run: python -m pytest -q tests/integration tests/resilience
