name: Phase 1 Domain Contracts
# Same-SHA gate anchor: architecture documentation closure commits must rerun contract CI.
# Project-state refreshes are evidence-bearing commits and must remain testable.
# Dual-workflow anchor keeps architecture and domain-contract evidence aligned.
# Gate-chain alignment: architecture, dependency, and domain evidence share one commit.

on:
  push:
    paths:
      - "contracts/**"
      - "tests/contracts/**"
      - ".github/workflows/phase1-domain-contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "tests/contracts/**"
      - ".github/workflows/phase1-domain-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1-domain-contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check --no-input pytest

      - name: Run Phase 1 contract tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/contracts/test_instrument_identity.py tests/contracts/test_contract_specification.py tests/contracts/test_settlement.py tests/contracts/test_margin.py tests/contracts/test_leverage.py tests/contracts/test_initial_margin.py tests/contracts/test_maintenance_margin.py tests/contracts/test_position_side_mode.py tests/contracts/test_price_quantity.py tests/contracts/funding_contract_test.py tests/contracts/pnl_contract_test.py tests/contracts/exposure_contract_test.py tests/contracts/liquidation_contract_test.py tests/contracts/liquidation_event_contract_test.py

# Same-SHA trigger anchor: liquidation-trigger contract closure verification.
