name: Phase 1 Domain Contracts
# Same-SHA gate anchor: architecture documentation closure commits must rerun contract CI.
# Project-state refreshes are evidence-bearing commits and must remain testable.
# Dual-workflow anchor keeps architecture and domain-contract evidence aligned.
# Gate-chain alignment: architecture, dependency, and domain evidence share one commit.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-domain-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase1-domain-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-ci.txt

      - name: Run Phase 1 completeness regression tests
        run: python -m pytest -q tests/architecture/test_phase1_completeness.py

      - name: Run Phase 1 contract tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/contracts/test_instrument_identity.py tests/contracts/test_contract_specification.py tests/contracts/test_settlement.py tests/contracts/test_margin.py tests/contracts/test_leverage.py tests/contracts/test_initial_margin.py tests/contracts/test_maintenance_margin.py tests/contracts/test_position_side_mode.py tests/contracts/test_price_quantity.py tests/contracts/funding_contract_test.py tests/contracts/pnl_contract_test.py tests/contracts/exposure_contract_test.py tests/contracts/liquidation_contract_test.py tests/contracts/liquidation_event_contract_test.py tests/contracts/accounting_contract_test.py

# Same-SHA trigger anchor: liquidation-trigger contract closure verification.

# Final same-SHA trigger anchor: liquidation-trigger verification after export repair.

# Same-SHA trigger anchor: accounting cursor follows liquidation-trigger closure.

# Final evidence trigger: current-head gate verification after state reconciliation.

# Same-SHA governance anchor: architecture-state changes rerun Phase 1 domain-contract evidence.
