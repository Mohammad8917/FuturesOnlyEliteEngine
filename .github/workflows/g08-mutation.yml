name: G08 Mutation Score

on:
  push:
    paths:
      - "contracts/**"
      - "tests/contracts/**"
      - "pyproject.toml"
      - "requirements-ci.txt"
      - ".github/workflows/g08-mutation.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "tests/contracts/**"
      - "setup.cfg"
      - "requirements-ci.txt"
      - ".github/workflows/g08-mutation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g08-mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install pinned mutation and CI dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-ci.txt
          python -m pip install --disable-pip-version-check --no-input mutmut==3.5.0

      - name: Run full mutation campaign
        run: |
          rm -rf mutants .mutmut-cache
          mutmut run
          mutmut export-cicd-stats

      - name: Enforce the immutable 90 percent mutation floor
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          report = Path("mutants/mutmut-cicd-stats.json")
          if not report.is_file():
              print("G08 FAIL: mutation statistics were not produced")
              sys.exit(1)
          try:
              stats = json.loads(report.read_text(encoding="utf-8"))
              total = int(stats["total"])
              skipped = int(stats["skipped"])
              killed = int(stats["killed"])
              timeout = int(stats["timeout"])
          except (OSError, json.JSONDecodeError, KeyError, TypeError, ValueError) as exc:
              print(f"G08 FAIL: mutation statistics are invalid: {exc}")
              sys.exit(1)
          tested = total - skipped
          if tested <= 0 or min(total, skipped, killed, timeout) < 0 or killed + timeout > tested:
              print("G08 FAIL: mutation statistics contain invalid counts")
              sys.exit(1)
          score = ((killed + timeout) / tested) * 100
          print(
              f"G08 mutation score: {killed} killed + {timeout} timed out "
              f"out of {tested} non-skipped mutants = {score:.2f}%"
          )
          if score < 90.0:
              print("G08 FAIL: required mutation score is >= 90.00%")
              sys.exit(1)
          print("G08 PASS: mutation score is >= 90.00%")
          PY

      - name: Verify mutation runner did not modify source
        run: git diff --exit-code -- contracts/futures
