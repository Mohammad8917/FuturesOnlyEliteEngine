name: G08 Mutation Score

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g08-mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install pinned mutation and CI dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-ci.txt
          python -m pip install --disable-pip-version-check --no-input mutmut==3.5.0

      - name: Run full mutation campaign
        run: |
          rm -rf mutants .mutmut-cache
          mutmut run
          mutmut results
          for mutant in \
            domain.futures.liquidation.x__positive_decimal__mutmut_1 \
            domain.futures.liquidation.x__positive_decimal__mutmut_3 \
            contracts.futures.price_quantity.x__positive_decimal__mutmut_7 \
            contracts.futures.position_side.x_validate_position_side__mutmut_2 \
            domain.futures.funding.x__decimal__mutmut_1 \
            domain.futures.funding.x__utc__mutmut_1 \
            contracts.futures.instrument.x__asset__mutmut_2 \
            domain.futures.margin.x__asset__mutmut_2 \
            domain.futures.liquidation_event.x__identifier__mutmut_4 \
            domain.futures.liquidation_event.x__non_negative_integer__mutmut_2 \
            domain.futures.settlement_accounting.x__sequence__mutmut_1 \
            domain.futures.accounting.x__text__mutmut_4 \
            domain.futures.financial_rounding.x_financial_working_context__mutmut_2 \
            domain.futures.financial_rounding.x_financial_working_context__mutmut_3 \
            domain.futures.financial_rounding.x_financial_working_context__mutmut_5 \
            domain.futures.financial_rounding.x__decimal__mutmut_3 \
            domain.futures.financial_rounding.x__decimal__mutmut_7 \
            domain.futures.financial_rounding.x__scale__mutmut_1 \
            domain.futures.financial_rounding.x__scale__mutmut_2 \
            domain.futures.financial_rounding.x__scale__mutmut_3 \
            domain.futures.financial_rounding.x__quantize__mutmut_3 \
            domain.futures.financial_rounding.x__quantize__mutmut_4 \
            domain.futures.financial_rounding.x__quantize__mutmut_6 \
            domain.futures.financial_rounding.x_round_pnl__mutmut_2 \
            domain.futures.financial_rounding.x_round_pnl__mutmut_3 \
            domain.futures.financial_rounding.x_round_pnl__mutmut_4 \
            domain.futures.financial_rounding.x_round_funding__mutmut_2 \
            domain.futures.financial_rounding.x_round_funding__mutmut_3 \
            domain.futures.financial_rounding.x_round_funding__mutmut_4 \
            domain.futures.financial_rounding.x_round_margin_ratio__mutmut_2 \
            domain.futures.financial_rounding.x_round_margin_ratio__mutmut_3 \
            domain.futures.financial_rounding.x_round_margin_ratio__mutmut_4 \
            domain.futures.financial_rounding.x_round_liquidation_price__mutmut_2 \
            domain.futures.financial_rounding.x_round_liquidation_price__mutmut_3 \
            domain.futures.financial_rounding.x_round_liquidation_price__mutmut_4 \
            domain.futures.financial_rounding.x_financial_working_context__mutmut_6 \
            domain.futures.financial_rounding.x__decimal__mutmut_9 \
            domain.futures.financial_rounding.x__positive__mutmut_3 \
            domain.futures.financial_rounding.x__positive__mutmut_8 \
            domain.futures.financial_rounding.x__scale__mutmut_1 \
            domain.futures.financial_rounding.x__scale__mutmut_2 \
            domain.futures.financial_rounding.x__quantize__mutmut_11 \
            domain.futures.financial_rounding.x__quantize__mutmut_14 \
            domain.futures.financial_rounding.x__quantize__mutmut_15 \
            domain.futures.financial_rounding.x__quantize__mutmut_16 \
            domain.futures.financial_rounding.x__quantize__mutmut_17 \
            domain.futures.financial_rounding.x_round_pnl__mutmut_14 \
            domain.futures.financial_rounding.x_round_pnl__mutmut_15 \
            domain.futures.financial_rounding.x_round_pnl__mutmut_16 \
            domain.futures.financial_rounding.x_round_pnl__mutmut_17 \
            domain.futures.financial_rounding.x_round_funding__mutmut_8 \
            domain.futures.financial_rounding.x_round_funding__mutmut_11 \
            domain.futures.financial_rounding.x_round_funding__mutmut_12 \
            domain.futures.financial_rounding.x_round_funding__mutmut_15 \
            domain.futures.financial_rounding.x_round_funding__mutmut_18 \
            domain.futures.financial_rounding.x_round_funding__mutmut_19 \
            domain.futures.financial_rounding.x_round_funding__mutmut_21 \
            domain.futures.financial_rounding.x_round_funding__mutmut_22 \
            domain.futures.financial_rounding.x_round_funding__mutmut_23 \
            domain.futures.financial_rounding.x_round_margin_ratio__mutmut_8 \
            domain.futures.financial_rounding.x_round_margin_ratio__mutmut_11 \
            domain.futures.financial_rounding.x_round_margin_ratio__mutmut_12 \
            domain.futures.financial_rounding.x_round_margin_ratio__mutmut_13 \
            domain.futures.financial_rounding.x_round_margin_ratio__mutmut_15 \
            domain.futures.financial_rounding.x_round_margin_ratio__mutmut_16 \
            domain.futures.financial_rounding.x_round_margin_ratio__mutmut_17 \
            domain.futures.financial_rounding.x_round_margin_ratio__mutmut_28 \
            domain.futures.financial_rounding.x_round_margin_ratio__mutmut_29 \
            domain.futures.financial_rounding.x_round_margin_ratio__mutmut_30 \
            domain.futures.financial_rounding.x_round_liquidation_price__mutmut_8 \
            domain.futures.financial_rounding.x_round_liquidation_price__mutmut_11 \
            domain.futures.financial_rounding.x_round_liquidation_price__mutmut_12 \
            domain.futures.financial_rounding.x_round_liquidation_price__mutmut_18 \
            domain.futures.financial_rounding.x_round_liquidation_price__mutmut_32 \
            domain.futures.financial_rounding.x_round_liquidation_price__mutmut_33 \
            domain.futures.financial_rounding.x_round_liquidation_price__mutmut_34 \
            domain.futures.financial_rounding.x_round_liquidation_price__mutmut_38 \
            domain.futures.financial_rounding.x_round_liquidation_price__mutmut_39 \
            domain.futures.financial_rounding.x_round_liquidation_price__mutmut_40 \
            domain.futures.financial_rounding.x_round_liquidation_price__mutmut_41; do
            echo "=== MUTANT DIAGNOSTIC: ${mutant} ==="
            mutmut show "${mutant}" || true
          done
          mutmut export-cicd-stats

      - name: Enforce the immutable 90 percent mutation floor
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          report = Path("mutants/mutmut-cicd-stats.json")
          if not report.is_file():
              print("G08 FAIL: mutation statistics were not produced")
              sys.exit(1)
          try:
              stats = json.loads(report.read_text(encoding="utf-8"))
              total = int(stats["total"])
              skipped = int(stats["skipped"])
              killed = int(stats["killed"])
              timeout = int(stats["timeout"])
          except (OSError, json.JSONDecodeError, KeyError, TypeError, ValueError) as exc:
              print(f"G08 FAIL: mutation statistics are invalid: {exc}")
              sys.exit(1)
          tested = total - skipped
          if tested <= 0 or min(total, skipped, killed, timeout) < 0 or killed + timeout > tested:
              print("G08 FAIL: mutation statistics contain invalid counts")
              sys.exit(1)
          score = ((killed + timeout) / tested) * 100
          print(
              f"G08 mutation score: {killed} killed + {timeout} timed out "
              f"out of {tested} non-skipped mutants = {score:.2f}%"
          )
          if score < 90.0:
              print("G08 FAIL: required mutation score is >= 90.00%")
              sys.exit(1)
          print("G08 PASS: mutation score is >= 90.00%")
          PY

      - name: Verify mutation runner did not modify source
        run: git diff --exit-code -- contracts/futures domain/futures
