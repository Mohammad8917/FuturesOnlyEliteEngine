name: G06 Security and Supply Chain

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g06-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan current and historical Git content for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install pinned security scanners and CI dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-ci.txt
          python -m pip install --disable-pip-version-check --no-input pip-audit==2.9.0 bandit==1.8.6 detect-secrets==1.5.0

      - name: Audit pinned CI dependencies
        run: python -m pip_audit -r requirements-ci.txt

      - name: Run Bandit static security analysis
        run: python -m bandit -r contracts validation -f json -o bandit-report.json

      - name: Scan tracked files for secrets
        run: |
          detect-secrets scan > detect-secrets-report.json
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          report = Path("detect-secrets-report.json")
          try:
              data = json.loads(report.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              print(f"G06 FAIL: secret scan report is invalid: {exc}")
              sys.exit(1)
          findings = {
              path: entries
              for path, entries in data.get("results", {}).items()
              if entries
          }
          if findings:
              print("G06 FAIL: potential hard-coded secrets detected:")
              for path, entries in sorted(findings.items()):
                  print(f"- {path}: {len(entries)} finding(s)")
              sys.exit(1)
          print("G06 PASS: no secret findings in tracked files")
          PY
