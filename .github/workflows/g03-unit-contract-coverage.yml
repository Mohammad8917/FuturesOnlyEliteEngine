name: G03 Unit Contract Coverage

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g03-unit-contract-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  g03-unit-contract-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-ci.txt

      - name: Verify G03 contract-test completeness
        run: python -m pytest -q tests/architecture/test_g03_contract_completeness.py

      - name: Run all Futures contract tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/contracts

# G03 is complete unit/contract coverage, not a percentage gate.
# G05 owns the >=98% coverage threshold; G08 owns mutation >=90%.
# No skip/xfail, test deletion, threshold reduction, or Spot/domain reuse is permitted.
# Same-SHA evidence is mandatory.
