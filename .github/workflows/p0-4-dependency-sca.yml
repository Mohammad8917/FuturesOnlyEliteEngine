name: P0-4 Dependency and SCA
run-name: P0-4 Dependency and SCA • ${{ github.event_name }} • ${{ github.sha }}

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "31 4 * * *"

concurrency:
  group: p0-4-sca-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-dependency-audit:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements-ci.txt
            requirements-security.txt

      - name: Install pinned CI and audit dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          -r requirements-ci.txt
          -r requirements-security.txt

      - name: Audit direct and transitive Python dependencies
        run: >-
          python -m pip_audit
          --strict
          --desc
          -r requirements-ci.txt
          -r requirements-security.txt
